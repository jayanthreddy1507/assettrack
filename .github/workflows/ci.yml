name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: assetflow_test
          POSTGRES_USER: assetflow
          POSTGRES_PASSWORD: assetflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assetflow -d assetflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://assetflow:assetflow@localhost:5432/assetflow_test?schema=public
      AUTH_SECRET: ci-auth-secret-ci-auth-secret-ci-auth-secret
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
      AUTH_TRUST_HOST: true
      APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      LOG_LEVEL: silent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
